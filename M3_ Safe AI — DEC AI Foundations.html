<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3: Safe AI — DEC AI Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#FFFFFF;
  --ink-soft:#94A3B8;
  --canvas:#0F172A;
  --card:#1E293B;
  --line:#334155;
  --line-soft:#1E293B;
  --safe:#10B981;
  --risky:#EF4444;
  --anonymize:#F59E0B;
  --neutral:#3B82F6;
  --r:16px;
  --shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  --dur:.25s;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"DM Sans", ui-sans-serif, system-ui, sans-serif;
  color:var(--ink);
  background-color:var(--canvas);
  background-image:
    linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100svh;
}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px 80px}

/* type */
h1,h2,h3,.display{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
.eyebrow{
  font-family:"JetBrains Mono",monospace;
  font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--neutral);
  font-weight:700;
}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.brandmark{display:flex;align-items:center;gap:10px; font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700}
.brandmark .glyph{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg, #FF5252, #B71C1C);color:#fff;display:grid;place-items:center;font-size:16px;}
.pips{display:flex;gap:6px;}
.pip{width:10px;height:10px;border-radius:50%;background:var(--line);transition:all var(--dur)}
.pip.done{background:var(--safe)}
.pip.now{background:var(--neutral);transform:scale(1.3)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;margin-bottom:16px;animation:fadein var(--dur) ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.hero h1{font-size:clamp(32px, 6vw, 48px);line-height:1.1;margin:12px 0 16px}
.hero p{font-size:17px;color:var(--ink-soft);max-width:54ch}

.module-title{font-size:24px;margin-bottom:8px;}
.module-desc{font-size:16px;color:var(--ink-soft);margin-bottom:20px;}

/* buttons */
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}
.btn{
  font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:14px 24px;cursor:pointer;
  border:none;background:var(--ink);color:var(--canvas);
  transition:transform 0.15s, opacity 0.15s;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-soft)}

/* quiz options */
.options-grid{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
.opt-btn{
  font:inherit;font-weight:700;font-size:16px;border-radius:12px;padding:16px 20px;
  cursor:pointer;background:rgba(255,255,255,0.03);border:2px solid var(--line);
  color:var(--ink);text-align:left;display:flex;align-items:center;justify-content:space-between;
  transition:all 0.2s;
}
.opt-btn:hover:not(:disabled){background:rgba(255,255,255,0.08);border-color:var(--ink-soft)}
.opt-btn:disabled{cursor:default;opacity:0.6}
.opt-btn.correct{background:rgba(16, 185, 129, 0.1);border-color:var(--safe);color:var(--safe);opacity:1}
.opt-btn.wrong{background:rgba(239, 68, 68, 0.1);border-color:var(--risky);color:var(--risky);opacity:1}

/* feedback */
.feedback{margin-top:20px;padding:16px;border-radius:12px;font-size:15px;animation:fadein var(--dur)}
.feedback.good{background:rgba(16,185,129,0.15);border-left:4px solid var(--safe)}
.feedback.bad{background:rgba(239,68,68,0.15);border-left:4px solid var(--risky)}
.feedback.warn{background:rgba(245,158,11,0.15);border-left:4px solid var(--anonymize)}

/* chart */
.chart-wrap{margin:30px 0;}
.bar-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.bar-label{width:140px;font-weight:700;font-size:14px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;text-align:right}
.bar-track{flex:1;height:24px;background:rgba(255,255,255,0.05);border-radius:12px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:12px;transition:width 1s cubic-bezier(0.2, 0.8, 0.2, 1);width:0%}
.bar-val{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700}

/* tags */
.tag{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.t-safe{background:rgba(16,185,129,0.2);color:var(--safe)}
.t-risky{background:rgba(239,68,68,0.2);color:var(--risky)}
.t-anon{background:rgba(245,158,11,0.2);color:var(--anonymize)}

.scenario-text{font-size:20px;font-weight:500;margin:16px 0;line-height:1.4}
.theory-block{background:rgba(0,0,0,0.2);padding:16px;border-radius:12px;margin:16px 0;border-left:3px solid var(--neutral)}

.progress-text{text-align:center;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);margin-bottom:16px}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brandmark"><span class="glyph">3</span>DEC AI Foundations</div>
    <div class="pips" id="pips"></div>
  </div>
  <div id="screen" aria-live="polite"></div>
</div>

<script>
const SCREENS = [
  {
    type: "hero",
    eyebrow: "Module 3",
    title: "Safe AI & Data Governance",
    desc: "AI is powerful, but uploading the wrong data can cost the company crores in lost bids, client lawsuits, or DPDP fines. Let's master the rules of AI safety in construction."
  },
  {
    type: "theory",
    eyebrow: "The Golden Rule",
    title: "How AI Processes Your Data",
    content: `
      <p>When you type into free tools like ChatGPT, your data goes to external servers and <strong>may be used to train future models</strong>.</p>
      <div class="theory-block">
        <strong style="color:var(--safe)">Enterprise Tools (Safe):</strong> Data is encrypted, processed, and immediately deleted. Never used for training.<br><br>
        <strong style="color:var(--risky)">Free Tools (Risky):</strong> Data is retained for 30 days and can influence answers given to competitors.
      </div>
      <p>A mistake here can leak vendor rates, tender bids, or client contracts.</p>
    `
  },
  {
    type: "quiz_sequence",
    eyebrow: "Is This Safe?",
    title: "Data Classification Quiz",
    desc: "Decide if it's Safe to upload, if you should Anonymize it first, or if it's Risky (Never share).",
    questions: [
      {
        q: "1. Ask AI to draft a safety checklist for height work",
        ans: "SAFE",
        why: "Generic safety knowledge is Tier 1 and completely safe to share.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "2. Upload 3 vendor quotes with names and exact rates",
        ans: "RISKY",
        why: "Vendor names + negotiated rates are Tier 3 Confidential. Sharing this exposes our cost structure to competitors.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "3. Ask AI to explain IS 456 concrete mix requirements",
        ans: "SAFE",
        why: "IS codes are public standards. There is no company-specific data here.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "4. Upload attendance register with Aadhaar numbers",
        ans: "RISKY",
        why: "Uploading PII (Personally Identifiable Information) violates India's DPDP Act and carries penalties up to ₹250 Cr.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "5. Upload test results with lab name replaced",
        ans: "SAFE",
        why: "Properly anonymized Tier 2 data. By removing the lab name, you protect identities while still getting AI's mathematical analysis.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "6. Upload full NSDL contract for review",
        ans: "RISKY",
        why: "Client contracts are Tier 3. A leaked contract allows competitors to see your legal positioning and client terms.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "7. Upload site photos, no logos visible",
        ans: "SAFE",
        why: "Generic photos with no identifiers (logos, faces, signage) are safe to analyze with AI vision tools.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "8. Share profit margin on Medical College project",
        ans: "RISKY",
        why: "Profit margins are commercially sensitive Tier 3 data. Never share this externally.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "9. Upload budget with vendors as 'A/B/C'",
        ans: "SAFE",
        why: "Properly anonymized Tier 2 data. AI can crunch the numbers without knowing who the vendors are.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "10. Ask AI to draft project status email",
        ans: "ANONYMIZE",
        why: "You should remove internal details, specific financial figures, and client names before asking for drafting help.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "11. Upload tender bid for NMDC project",
        ans: "RISKY",
        why: "Tender bids are the most critical Tier 3 data. A leaked bid allows competitors to easily underbid us.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "12. Compare two scaffolding designs",
        ans: "ANONYMIZE",
        why: "It's OK technically to compare designs, but you must remove the project name and location first.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "13. Upload subcontractor insurance certificate",
        ans: "ANONYMIZE",
        why: "Remove the subcontractor's company name and PII, but keep the policy details for AI to check compliance.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "14. Share DEC Infra annual revenue figures",
        ans: "RISKY",
        why: "Tier 3 data unless it is already in a public ROC filing. Avoid sharing financial totals.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      },
      {
        q: "15. Ask how to write a change order justification",
        ans: "SAFE",
        why: "Asking for a generic template or instructions is completely safe.",
        opts: [{l:"SAFE ✓",v:"SAFE"}, {l:"ANONYMIZE ⚠",v:"ANONYMIZE"}, {l:"RISKY ✗",v:"RISKY"}]
      }
    ]
  },
  {
    type: "theory",
    eyebrow: "The Second Risk",
    title: "AI Hallucinations",
    content: `
      <p>AI doesn't "know" facts; it predicts the next likely word. It can confidently state things that are completely wrong.</p>
      <div class="theory-block" style="border-color:var(--anonymize)">
        <strong>Hallucination Red Flags:</strong>
        <ul style="margin-top:8px;padding-left:20px;opacity:0.9">
          <li>Very specific clause numbers (e.g., Clause 7.4.2(b))</li>
          <li>Precise decimal values (e.g., 31.47 MPa)</li>
          <li>Detailed fictional company profiles</li>
        </ul>
      </div>
      <p>Always verify critical outputs (safety protocols, concrete specs) with a qualified engineer or official document.</p>
    `
  },
  {
    type: "quiz_sequence",
    eyebrow: "Fact or Fiction?",
    title: "Spot the Hallucination",
    desc: "Review these AI responses and decide if they are factual or likely hallucinations.",
    questions: [
      {
        q: "AI says: 'As per IS 3696 Part 1:1987, Clause 7.4.2, scaffolding above 4m requires nets with mesh ≤100mm.'",
        ans: "HALLUCINATION",
        why: "IS 3696 exists, but Clause 7.4.2 does not. AI frequently fabricates specific clause numbers to sound authoritative.",
        opts: [{l:"FACT",v:"FACT"}, {l:"HALLUCINATION",v:"HALLUCINATION"}]
      },
      {
        q: "AI provides a specific M30 concrete mix design: 'Cement 380 kg/m³, FA 695 kg/m³, CA 1180 kg/m³'",
        ans: "HALLUCINATION",
        why: "Actual mix designs require lab testing of local aggregates and moisture. AI is guessing based on generic formulas.",
        opts: [{l:"FACT",v:"FACT"}, {l:"HALLUCINATION",v:"HALLUCINATION"}]
      },
      {
        q: "AI says: 'Quality Concrete Ltd completed 5 government projects, holds ISO 9001, and has 15 years experience.'",
        ans: "HALLUCINATION",
        why: "Quality Concrete Ltd is a fictional company. AI will invent entire company histories rather than admitting it doesn't know.",
        opts: [{l:"FACT",v:"FACT"}, {l:"HALLUCINATION",v:"HALLUCINATION"}]
      }
    ]
  },
  {
    type: "results",
    title: "Module Complete",
    desc: "You've mastered the fundamentals of Safe AI at DEC Infra. Here is your performance summary:"
  }
];

let currentScreen = 0;
let subIndex = 0;
let state = {
  scores: {
    "Data Safety (15)": {correct:0, total:15},
    "Hallucinations (3)": {correct:0, total:3}
  },
  totalCorrect: 0,
  totalQuestions: 18
};

const el = id => document.getElementById(id);
const screenEl = el("screen");

function renderPips() {
  let html = '';
  for(let i=0; i<SCREENS.length; i++) {
    let cls = 'pip';
    if(i < currentScreen) cls += ' done';
    if(i === currentScreen) cls += ' now';
    html += `<div class="${cls}"></div>`;
  }
  el("pips").innerHTML = html;
}

function renderHero(data) {
  screenEl.innerHTML = `
    <div class="card hero">
      <span class="eyebrow">${data.eyebrow}</span>
      <h1>${data.title}</h1>
      <p>${data.desc}</p>
      <div class="actions">
        <button class="btn" onclick="nextScreen()">Start Module</button>
      </div>
    </div>
  `;
}

function renderTheory(data) {
  screenEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">${data.eyebrow}</span>
      <h2 class="module-title" style="margin-top:8px">${data.title}</h2>
      <div style="font-size:17px;line-height:1.6">${data.content}</div>
      <div class="actions">
        <button class="btn" onclick="nextScreen()">Continue</button>
      </div>
    </div>
  `;
}

function renderQuiz(data) {
  const q = data.questions[subIndex];
  const progress = `Scenario ${subIndex+1} of ${data.questions.length}`;
  
  let optsHtml = q.opts.map(o => 
    `<button class="opt-btn" onclick="handleAnswer('${o.v}', this)">${o.l}</button>`
  ).join('');

  screenEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">${data.eyebrow}</span>
      <h2 class="module-title" style="margin-top:8px">${data.title}</h2>
      <div class="progress-text">${progress}</div>
      
      <div class="scenario-text">${q.q}</div>
      
      <div class="options-grid" id="optGrid">
        ${optsHtml}
      </div>
      
      <div id="feedbackArea"></div>
    </div>
  `;
}

window.handleAnswer = function(selected, btnEl) {
  const data = SCREENS[currentScreen];
  const q = data.questions[subIndex];
  const isCorrect = (selected === q.ans);
  
  const category = (data.title.includes("Data")) ? "Data Safety (15)" : "Hallucinations (3)";
  if(isCorrect) {
    state.scores[category].correct++;
    state.totalCorrect++;
  }
  
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  
  if(isCorrect) {
    btnEl.classList.add('correct');
  } else {
    btnEl.classList.add('wrong');
    btns.forEach(b => {
      if(b.innerText.includes(q.ans)) b.classList.add('correct');
    });
  }
  
  const fClass = isCorrect ? 'good' : 'bad';
  const fIcon = isCorrect ? '✓ Correct' : '✗ Incorrect';
  
  el("feedbackArea").innerHTML = `
    <div class="feedback ${fClass}">
      <strong>${fIcon}</strong> — ${q.why}
    </div>
    <div class="actions">
      <button class="btn" onclick="nextSub()">${subIndex < data.questions.length-1 ? 'Next Scenario' : 'Continue'}</button>
    </div>
  `;
}

window.nextSub = function() {
  const data = SCREENS[currentScreen];
  if (subIndex < data.questions.length - 1) {
    subIndex++;
    renderQuiz(data);
  } else {
    nextScreen();
  }
}

function renderResults(data) {
  let barsHtml = '';
  for(const [cat, score] of Object.entries(state.scores)) {
    const pct = Math.round((score.correct / score.total) * 100);
    const color = pct >= 80 ? 'var(--safe)' : (pct >= 50 ? 'var(--anonymize)' : 'var(--risky)');
    barsHtml += `
      <div class="bar-row">
        <div class="bar-label">${cat}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:0%; background:${color}" data-width="${pct}%"></div>
          <div class="bar-val">${score.correct}/${score.total}</div>
        </div>
      </div>
    `;
  }

  const finalPct = Math.round((state.totalCorrect / state.totalQuestions) * 100);
  let msg = "Great job!";
  if(finalPct < 60) msg = "Keep practicing. Review the 3-Tier system.";
  else if(finalPct >= 90) msg = "Excellent! You are an AI Safety Expert. 🏆";

  screenEl.innerHTML = `
    <div class="card result">
      <span class="eyebrow">Results</span>
      <h1 class="hero" style="font-size:36px;margin:8px 0">${data.title}</h1>
      <p style="font-size:18px;color:var(--ink-soft)">${data.desc}</p>
      
      <div class="chart-wrap">
        ${barsHtml}
      </div>
      
      <div class="theory-block" style="text-align:center;border-left:none;background:rgba(255,255,255,0.05)">
        <div style="font-size:48px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif">${finalPct}%</div>
        <div style="color:var(--ink-soft)">${msg}</div>
      </div>

      <div class="actions" style="justify-content:center">
        <button class="btn ghost" onclick="restart()">Restart Module</button>
      </div>
    </div>
  `;

  setTimeout(() => {
    document.querySelectorAll('.bar-fill').forEach(b => {
      b.style.width = b.dataset.width;
    });
  }, 100);
}

window.nextScreen = function() {
  currentScreen++;
  subIndex = 0;
  loadScreen();
}

window.restart = function() {
  currentScreen = 0;
  subIndex = 0;
  state = {
    scores: {
      "Data Safety (15)": {correct:0, total:15},
      "Hallucinations (3)": {correct:0, total:3}
    },
    totalCorrect: 0,
    totalQuestions: 18
  };
  loadScreen();
}

function loadScreen() {
  renderPips();
  const data = SCREENS[currentScreen];
  if(data.type === 'hero') renderHero(data);
  else if(data.type === 'theory') renderTheory(data);
  else if(data.type === 'quiz_sequence') renderQuiz(data);
  else if(data.type === 'results') renderResults(data);
}

loadScreen();

</script>
</body>
</html>
